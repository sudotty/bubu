name: Native package smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Resolve native package scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      native: ${{ steps.scope.outputs.native || steps.manual-scope.outputs.native }}
    steps:
      - name: Check out complete comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Resolve native package scope
        id: scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: git diff --name-only "$BASE_SHA" "$HEAD_SHA" | node scripts/ci-policy.mjs --changed-files
      - name: Require native package scope for manual runs
        id: manual-scope
        if: github.event_name != 'pull_request'
        shell: bash
        run: echo 'native=true' >> "$GITHUB_OUTPUT"

  hub-postgresql:
    name: Hub PostgreSQL transaction evidence
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUBU_HUB_TEST_DATABASE_URL: postgresql:///runner?host=%2Fvar%2Frun%2Fpostgresql
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Start isolated PostgreSQL authority store
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser --superuser runner
          sudo -u postgres createdb --owner=runner runner
      - name: Verify transactional Hub persistence
        run: npm --workspace @bubu/hub run test:postgres

  native-package:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS 13+ arm64
            runner: macos-15
            platform: darwin
            arch: arm64
            installer: apps/desktop/out/make/BuBu.dmg
          - name: macOS 13+ x64
            runner: macos-15-intel
            platform: darwin
            arch: x64
            installer: apps/desktop/out/make/BuBu.dmg
          - name: Windows 10 22H2+ x64
            runner: windows-2025
            platform: win32
            arch: x64
            installer: apps/desktop/out/make/squirrel.windows/x64/BuBu-Setup.exe
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/data-core/go.mod
          cache-dependency-path: services/data-core/go.sum
      - name: Install locked dependencies
        run: npm ci
      - name: Verify native runner target
        run: |
          node -e "if(process.platform!=='${{ matrix.platform }}'||process.arch!=='${{ matrix.arch }}')throw new Error('runner target mismatch: '+process.platform+'-'+process.arch)"
      - name: Build native application
        run: npm run build
      - name: Make native installer
        run: npm run make -w @bubu/desktop -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --skip-package
      - name: Exercise clean install, launch, backup, restore, and uninstall
        run: node scripts/smoke-native-installer.mjs --artifact="${{ github.workspace }}/${{ matrix.installer }}" --report="${{ runner.temp }}/installer-smoke.json"
      - name: Upload lifecycle report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-smoke-${{ matrix.platform }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/installer-smoke.json
          if-no-files-found: error
          retention-days: 3

  package-contract:
    name: Native package contract
    if: always()
    needs: [changes, hub-postgresql, native-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every applicable native proof
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          NATIVE_REQUIRED: ${{ needs.changes.outputs.native }}
          HUB_RESULT: ${{ needs.hub-postgresql.result }}
          NATIVE_RESULT: ${{ needs.native-package.result }}
        shell: bash
        run: |
          test "$CHANGES_RESULT" = "success"
          if [[ "$NATIVE_REQUIRED" == "true" ]]; then
            test "$HUB_RESULT" = "success"
            test "$NATIVE_RESULT" = "success"
          else
            test "$HUB_RESULT" = "skipped"
            test "$NATIVE_RESULT" = "skipped"
          fi
