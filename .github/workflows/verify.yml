name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request-policy:
    name: Pull request policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate squash commit title
        if: github.event_name == 'pull_request'
        env:
          BUBU_PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/ci-policy.mjs --pull-request-title
      - name: Preserve the policy check on main
        if: github.event_name != 'pull_request'
        run: node -e "console.log('Pull-request title policy applies at review time.')"

  fast-contract:
    name: Fast product contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: services/data-core/go.mod
          cache-dependency-path: services/data-core/go.sum
      - name: Install locked dependencies
        run: npm ci
      - name: Verify fast product contract
        run: npm run verify:fast
