schemaVersion: 1
product:
  id: bubu
  name: BuBu
  definition: local-first AI data workspace for conversational spreadsheet analysis and automation
  defaultMode: local-private
  releaseStage: private-beta
release:
  versionSource: package.json
  tagPattern: v<semver>
  channel: preview
  targets:
    - darwin-arm64
    - darwin-x64
    - win32-x64
  previewTargets:
    - win32-arm64
  minimumSystems:
    macos: "13"
    windows: "10-22H2"
architecture:
  desktop: electron
  renderer: sandboxed-react
  aiRuntime: node-utility-process
  dataCore: go-sidecar
  localDatabase: sqlite
  hubPersistence: private-file-or-postgresql-transactional-v1
  enterpriseDatabase: planned-normalized-postgresql-scale
privacy:
  defaultDisclosure: schema-synthetic
  allowedDisclosureLevels:
    - schema-only
    - schema-synthetic
    - aggregates
    - explicit-rows
    - retrieved-chunks
  remoteRawRowsByDefault: false
productCapabilities:
  local-first-data-workspace: available-local
  clean-merge-compare-reconcile: available-local
  conversation-evidence-and-reports: available-local
  recurring-work-automation: available-local
  privacy-retention-and-recovery: available-local
  model-assisted-analysis: available-optional
  local-knowledge-and-mcp: available-optional
  encrypted-hub-collaboration: available-optional
  signed-public-distribution: external-evidence-required
  design-partner-validation: external-evidence-required
  enterprise-horizontal-scale: future
